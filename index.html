<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Build a Brain — Neural Networks from Scratch</title>
<meta name="description" content="A step-by-step course teaching everything you need to build a neural network from scratch — starting with the math.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#f5f6fb; --card:#ffffff; --ink:#1c1e2b; --muted:#767a92;
    --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#ecebfd;
    --good:#2f9e5b; --good-soft:#e7f7ee; --bad:#d9534f; --bad-soft:#fdecec;
    --okay:#e0a200; --line:#e6e8f5; --locked:#c7cadf;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
  }
  button{font-family:inherit; cursor:pointer;}
  a{color:var(--accent);}

  header{
    position:sticky; top:0; z-index:10; display:flex; align-items:center;
    justify-content:space-between; padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:rgba(245,246,251,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px;}
  .brand .logo{font-size:20px;}
  .gear{background:none; border:none; font-size:20px; color:var(--muted); padding:6px;}

  main{max-width:720px; margin:0 auto; padding:16px 16px calc(48px + env(safe-area-inset-bottom));}

  /* ---------- Roadmap / hero ---------- */
  .hero{padding:18px 4px 22px; text-align:center;}
  .hero h1{margin:0 0 6px; font-size:28px; font-weight:900; letter-spacing:-.01em;}
  .hero .tagline{margin:0 0 16px; color:var(--muted); font-size:15px; line-height:1.5;}
  .bar{background:var(--line); border-radius:20px; height:10px; overflow:hidden;}
  .bar.big{height:14px;}
  .bar .fill{background:linear-gradient(90deg,#6d5ff0,var(--accent)); height:100%; border-radius:20px; transition:width .3s;}
  .overall-progress{display:flex; flex-direction:column; gap:6px; align-items:center;}
  .overall-progress span{font-size:13px; color:var(--muted); font-weight:600;}

  /* ---------- Path (vertical timeline of phases) ---------- */
  .path{position:relative; padding-left:36px; margin-top:8px;}
  .path::before{
    content:""; position:absolute; left:15px; top:6px; bottom:6px; width:3px;
    background:linear-gradient(180deg, var(--accent) 0, var(--accent) 60px, var(--line) 60px, var(--line) 100%);
    border-radius:3px;
  }
  .phase{position:relative; margin-bottom:14px;}
  .phase .node{
    position:absolute; left:-36px; top:0; width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;
    background:var(--accent); color:#fff; box-shadow:0 0 0 5px var(--bg);
  }
  .phase.locked .node{background:#fff; color:var(--locked); border:2px solid var(--locked); font-size:14px;}
  .phase-body{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; box-shadow:0 2px 10px rgba(30,30,60,.03);}
  .phase.locked .phase-body{background:transparent; border-style:dashed; box-shadow:none;}
  .phase-title{font-weight:800; font-size:15px; line-height:1.35;}
  .phase.locked .phase-title{color:var(--muted); font-weight:700;}
  .phase-sub{margin-top:4px; font-size:12px; color:var(--locked); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  .phase-progress{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .phase-progress .bar{flex:1;}
  .phase-progress span{font-size:12px; color:var(--muted); font-weight:700; white-space:nowrap;}

  .lesson-list{margin-top:12px; display:flex; flex-direction:column; gap:6px;}
  .lesson-row{
    display:flex; align-items:center; gap:10px; width:100%; background:var(--bg);
    border:1px solid var(--line); border-radius:12px; padding:10px 12px; text-align:left;
    font-size:14px; color:var(--ink);
  }
  .lesson-row:active{background:var(--accent-soft);}
  .lesson-row .status{
    width:20px; height:20px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center;
    justify-content:center; font-size:12px; font-weight:900; color:#fff; background:#d8dae9;
  }
  .lesson-row .status.started{background:var(--okay);}
  .lesson-row .status.complete{background:var(--good);}
  .lesson-row .lnum{flex:0 0 auto; color:var(--muted); font-weight:700; font-size:12px; min-width:16px;}
  .lesson-row .ltitle{flex:1; line-height:1.3;}
  .lesson-row .lscore{flex:0 0 auto; font-size:11px; font-weight:800; color:var(--good); background:var(--good-soft); padding:2px 7px; border-radius:10px;}
  .lesson-row .chev{flex:0 0 auto; color:var(--muted);}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translate(-50%,20px);
    background:#22243a; color:#fff; padding:12px 18px; border-radius:14px; font-size:13px; font-weight:600;
    opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; z-index:40; max-width:88vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}

  /* ---------- Lesson view ---------- */
  .back-btn{background:none; border:none; color:var(--accent); font-weight:700; font-size:14px; padding:6px 0 10px;}
  .lesson-crumb{color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
  .lesson-title{margin:4px 0 16px; font-size:23px; font-weight:900; line-height:1.25;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:14px;}
  .card h2{margin:0 0 10px; font-size:15px; font-weight:800;}
  .objectives{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:14px;}
  .explanation p{margin:0 0 12px; font-size:15px; line-height:1.65;}
  .explanation p:last-child{margin-bottom:0;}
  .example{background:var(--accent-soft); border-color:#dcdafc;}
  .ex-problem{font-weight:700; font-size:14.5px; margin-bottom:10px;}
  .ex-steps{margin:0 0 10px; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:14px;}
  .ex-answer{font-weight:800; font-size:14.5px; background:#fff; border-radius:10px; padding:8px 12px; display:inline-block;}

  .practice-item{padding:12px 0; border-bottom:1px solid var(--line);}
  .practice-item:last-child{border-bottom:none; padding-bottom:0;}
  .practice-problem{font-size:14.5px; line-height:1.5; margin-bottom:8px;}
  .reveal-btn{background:var(--accent-soft); color:var(--accent); border:none; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:700;}
  .practice-solution{margin-top:10px; background:var(--bg); border-radius:10px; padding:10px 12px; font-size:13.5px; line-height:1.6; white-space:pre-line;}

  .quiz-q{padding:14px 0; border-bottom:1px solid var(--line);}
  .quiz-q:first-child{padding-top:0;}
  .qtext{font-size:14.5px; margin-bottom:10px; line-height:1.5;}
  .choices{display:flex; flex-direction:column; gap:8px;}
  .choice{
    background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:10px 12px;
    text-align:left; font-size:14px; color:var(--ink);
  }
  .choice:disabled{opacity:.85;}
  .choice.correct{background:var(--good-soft); border-color:var(--good); color:#1d6b3c; font-weight:700;}
  .choice.incorrect{background:var(--bad-soft); border-color:var(--bad); color:#a33330; font-weight:700;}
  .short-answer{display:flex; gap:8px;}
  .short-answer input{
    flex:1; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; font-size:14px; min-width:0;
  }
  .checkbtn{background:var(--accent); color:#fff; border:none; border-radius:12px; padding:10px 16px; font-size:13px; font-weight:700;}
  .checkbtn:disabled, .short-answer input:disabled{opacity:.6;}
  .qfeedback{margin-top:10px; font-size:13.5px; line-height:1.5; padding:9px 12px; border-radius:10px; display:none;}
  .qfeedback.show{display:block;}
  .qfeedback.good{background:var(--good-soft); color:#1d6b3c;}
  .qfeedback.bad{background:var(--bad-soft); color:#a33330;}

  .bigbtn{width:100%; background:var(--accent); color:#fff; border:none; border-radius:14px; padding:15px; font-size:15px; font-weight:800; margin-top:6px;}
  .bigbtn:disabled{background:#c9cbe0; color:#fff;}
  .quiz-result{margin-top:14px; text-align:center;}
  .quiz-result h3{margin:0 0 6px; font-size:20px;}
  .quiz-result p{margin:0 0 12px; color:var(--muted); font-size:14px;}

  .lesson-nav{display:flex; gap:10px; margin-top:6px;}
  .lesson-nav .navbtn{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    font-size:12.5px; font-weight:700; color:var(--ink); text-align:left; line-height:1.35;
  }
  .lesson-nav .navbtn:last-child{text-align:right;}
  .lesson-nav span{flex:1;}

  /* ---------- settings sheet ---------- */
  .sheet{position:fixed; inset:0; background:rgba(20,20,35,.45); display:none; align-items:flex-end; z-index:30;}
  .sheet.show{display:flex;}
  .sheetinner{background:#fff; width:100%; border-radius:20px 20px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom)); max-height:85vh; overflow:auto;}
  .sheetinner h3{margin:0 0 10px;}
  .row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .sheetinner button{border:none; border-radius:12px; padding:10px 14px; font-size:13px; font-weight:700;}
  .tiny{font-size:11.5px; color:var(--muted); margin-top:14px; line-height:1.5;}
  .close{background:var(--accent-soft); color:var(--accent); width:100%; margin-top:14px; padding:12px !important;}

  @media (min-width:640px){
    .lesson-title{font-size:26px;}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">🧠</span><b>Build a Brain</b></div>
  <button class="gear" id="gearBtn" aria-label="settings">⚙</button>
</header>

<main id="app"></main>

<div id="toast"></div>

<div class="sheet" id="sheet">
  <div class="sheetinner">
    <h3>Settings</h3>
    <div class="row"><span>Phase 1 lessons complete</span><b id="s_done">0/20</b></div>
    <div class="row"><span>Average quiz score</span><b id="s_avg">—</b></div>
    <div class="row" style="margin-top:14px"><span style="color:var(--bad)">Reset all progress</span>
      <button style="background:var(--bad-soft);color:var(--bad)" id="resetBtn">Reset</button></div>
    <p class="tiny">Progress is saved on this device only — no account, no login, nothing sent anywhere.
      This is a long course: new phases get added over time, so check back for more of the path to unlock.</p>
    <button class="close" id="closeSheet">Done</button>
  </div>
</div>

<script src="data/curriculum.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
